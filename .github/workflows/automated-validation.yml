name: Automated validation

on:
  push:
    branches:
      - test/automated-quality-checks
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend runtime and test dependencies
        run: >-
          python -m pip install --upgrade pip pytest python-dotenv
          fastapi python-multipart sqlmodel "python-jose[cryptography]"
          "passlib[bcrypt]" "bcrypt==4.1.3" google-genai httpx
          "numpy<2" opencv-python-headless pillow
          google-api-python-client google-auth-oauthlib google-auth-httplib2
          groq yt-dlp scenedetect
      - name: Install FFmpeg for subtitle-render integration test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
      - name: Compile backend Python files
        working-directory: backend
        run: python -m compileall -q .
      - name: Run unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
